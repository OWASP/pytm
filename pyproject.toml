[project]
name = "pytm"
version = "1.4.0"
description = "A Pythonic framework for threat modeling"
authors = [{ name = "pytm Team", email = "please_use_github_issues@nowhere.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Natural Language :: English",
]
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/OWASP/pytm"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10.0.0",
    "pdoc3>=0.11.6,<0.12.0",
    "ruff>=0.15.11,<0.16.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — the formatter handles line length for reformattable code
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytm"]
